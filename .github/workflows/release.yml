name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag and release metadata
        run: npm run release:check -- "$GITHUB_REF_NAME"

      - name: Run tests and production build
        run: npm test

      - name: Package release
        run: zip "knowflow-${GITHUB_REF_NAME}.zip" main.js manifest.json styles.css

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "knowflow-${GITHUB_REF_NAME}.zip"
          main.js
          manifest.json
          styles.css
          --generate-notes
          --title "KnowFlow ${GITHUB_REF_NAME}"
