name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run release:check

      - name: Run tests and production build
        run: npm test

      - name: Package installable plugin
        run: zip knowflow-ci.zip main.js manifest.json styles.css

      - name: Upload installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowflow-ci
          path: knowflow-ci.zip
          if-no-files-found: error
          retention-days: 14
